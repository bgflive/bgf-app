.najbolji{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#ecfdf3;border:1px solid #bbf0d0;border-radius:14px;padding:10px 12px;margin-bottom:12px;color:#166534;font-weight:700;font-size:13.5px}
.najbolji button{border:0;background:#16a34a;color:#fff;border-radius:10px;padding:3px 9px;font-weight:800;font-size:12.5px}
.upoz{display:flex;gap:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:10px 12px;margin-bottom:12px;color:#9a3412;font-size:13.5px}
.alarm{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#f3f6fa;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:13.5px}
.alarm button{width:52px;height:30px;border-radius:16px;border:2px solid #b8c2cf;background:#e9edf3;position:relative;flex:0 0 auto}
.alarm button::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a97a8;transition:left .2s}
.alarm button.on{background:#0456E8;border-color:#0456E8}.alarm button.on::after{left:25px;background:#fff}
.mjlista h4{margin:14px 0 2px;font-size:12.5px;letter-spacing:.8px;color:#5f6f86}

#uvod{background:radial-gradient(70% 45% at 50% 45%,#0b2a5c 0%,#05101f 60%,#03070f 100%)!important;overflow:hidden}
#uvod img,#uvod small{position:relative;z-index:1}
#uvod .crta{width:min(80vw,380px);height:1px;background:rgba(120,150,200,.35);position:relative;z-index:1;opacity:0;animation:isk .6s .4s forwards}
#uvod .mono{position:relative;z-index:1;font:500 12.5px ui-monospace,"DejaVu Sans Mono",Menlo,monospace;color:#9fb3cf;text-align:center;line-height:1.7;opacity:0;animation:isk .6s .7s forwards;padding:0 16px}
#uvod .mono b{color:#2f7bff;font-weight:600}
.vrh{background:linear-gradient(180deg,#071A2D,#06142a)!important}
.vrh .sloj,.mvrh .sloj{position:absolute;inset:0;z-index:0;pointer-events:none}
.mvrh{position:relative;overflow:hidden;background:linear-gradient(180deg,#071A2D,#06142a)!important}.mvrh > *:not(.sloj){position:relative;z-index:1}
.ticker div{font-family:inherit;font-weight:700;letter-spacing:.2px}

.vrh{padding:14px 18px 16px!important}
.redak2{height:30px;display:flex;align-items:center;margin-top:8px;color:#e6f0ff;font-weight:700;overflow:hidden;white-space:nowrap}
.naslovV2{font-size:22px;font-weight:800;color:#fff}
.stanje2{display:flex;align-items:center;gap:8px;font-size:14px}.stanje2 .t{width:8px;height:8px;border-radius:50%;background:#EF4444;animation:puls 1.4s infinite}
.stanje2 .sport{font-size:20px}
.vrh .trazi{margin-top:10px;min-height:54px;box-sizing:border-box}
.pozdrav2{display:flex;align-items:center;gap:10px;background:#eef4ff;padding:10px 18px;color:#071A2D}
.pozdrav2 .av{width:34px;height:34px;font-size:12px}.pozdrav2 b{display:block;font-size:14px}.pozdrav2 small{color:#5f6f86}
.pozdrav2 button{margin-left:auto;background:#0456E8;color:#fff;border:0;border-radius:16px;padding:6px 12px;font-weight:800;font-size:12.5px}
.vrijeme2{width:100%;border:0;border-bottom:1px solid #e6ebf2;text-align:left;cursor:pointer;display:flex;flex-wrap:nowrap!important;white-space:nowrap;overflow:hidden;gap:14px;flex-wrap:wrap;padding:8px 18px;background:#f3f6fa;color:#334155;font-size:12.5px;font-weight:600;border-bottom:1px solid #e6ebf2}
/* vremenska crta koja se lista prstom, s očitanjem u sredini (kao aplikacije za more) */
.vc{position:relative;margin:0 -16px}
.vc .ocit{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 6px}
.vc .ocit b{font-size:22px}.vc .ocit small{color:var(--siva);font-weight:600}
.vc .trak2{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.vc .trak2::-webkit-scrollbar{display:none}
.vc svg{display:block}
.vc .igla{position:absolute;left:50%;top:38px;bottom:22px;width:2px;background:#EF4444;transform:translateX(-1px);pointer-events:none}
.vc .igla::before{content:'';position:absolute;top:-5px;left:-4px;width:10px;height:10px;border-radius:50%;background:#EF4444}
.vc .savjet{font-size:11.5px;color:#8a97a8;text-align:center;margin-top:2px}

.mjtraka{border:0;width:100%;text-align:left;color:#071A2D;gap:8px;font:600 16px -apple-system,Roboto,Arial,sans-serif;min-height:54px}
.mjtraka .tvl{color:#5f6f86;font-weight:500;font-size:14px}
.mdani2{display:flex;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid #e6ebf2;padding:0 8px;position:sticky;top:0;z-index:5}.mdani2::-webkit-scrollbar{display:none}
.mdani2 button{flex:0 0 auto;min-width:56px;background:none;border:0;color:#5f6f86;padding:8px 6px 8px;border-bottom:3px solid transparent;text-align:center}
.mdani2 button b{display:block;font-size:19px;color:#071A2D}.mdani2 button small{font-weight:700;font-size:11px;letter-spacing:.5px}.mdani2 button i{display:block;font-style:normal;font-size:14px}
.mdani2 button[aria-pressed="true"]{border-bottom-color:#0456E8;color:#0456E8}.mdani2 button[aria-pressed="true"] b{color:#0456E8}
.vc .igla{top:40px;bottom:16px}
.vc .ocit b b{font-size:22px}.vc .ocit .dod{font-size:13.5px;font-weight:700;color:#334155;margin-left:4px}

const RX = [["Kačenje (\\d+) zapisano u (\\d+:\\d+)", ["Strike $1 recorded at $2", "Biss $1 erfasst um $2", "Abboccata $1 registrata alle $2"]], ["\\. Prijava je stigla u Admin organizatora \\((.+)\\) — dobio je obavijest i e-poštu\\. Organizator potvrđuje prijavu, označuje uplatu i dodjeljuje startni broj\\. Ostali članovi dobivaju obavijest da su dodani; kapetan mijenja sastav do roka\\.", [". The entry has reached the organiser's Admin ($1) — they got a notification and an email. The organiser confirms the entry, marks payment and assigns the start number. Other members are notified; the captain can change the crew until the deadline.", ". Die Anmeldung ist im Admin des Veranstalters ($1) — er wurde benachrichtigt und per E-Mail informiert. Er bestätigt, markiert die Zahlung und vergibt die Startnummer. Andere Mitglieder werden benachrichtigt.", ". L'iscrizione è arrivata nell'Admin dell'organizzatore ($1) — ha ricevuto notifica ed e-mail. Conferma l'iscrizione, segna il pagamento e assegna il numero. Gli altri membri ricevono una notifica."]], ["Organizator \\((.+)\\) vidi prijavu i dodjeljuje startni broj\\. Ostali članovi dobivaju obavijest da su dodani\\. Kapetan mijenja sastav do roka organizatora\\.", ["The organiser ($1) sees the entry and assigns the start number. Other members are notified. The captain can change the crew until the organiser's deadline.", "Der Veranstalter ($1) sieht die Anmeldung und vergibt die Startnummer. Andere Mitglieder werden benachrichtigt. Der Kapitän ändert die Crew bis zur Frist.", "L'organizzatore ($1) vede l'iscrizione e assegna il numero. Gli altri membri ricevono una notifica. Il capitano modifica l'equipaggio fino alla scadenza."]], ["BGF\\.LIVE ne naplaćuje ništa — uplata ide izravno organizatoru, a on u Adminu označi „plaćeno”\\. Potvrdu uplate možeš priložiti ako je organizator traži\\.", ["BGF.LIVE charges nothing — payment goes directly to the organiser, who marks it “paid” in Admin. Attach proof if the organiser asks for it.", "BGF.LIVE verlangt nichts — die Zahlung geht direkt an den Veranstalter, der sie im Admin als „bezahlt” markiert. Nachweis anhängen, falls verlangt.", "BGF.LIVE non incassa nulla — il pagamento va direttamente all'organizzatore, che lo segna “pagato” in Admin. Allega la ricevuta se richiesta."]], ["Podaci se povlače iz registra: tko ima dozvolu za 2027\\. — zeleno odmah; tko nema, upisuje je u sljedećem koraku\\. Veličina majice iz profila\\.", ["Data comes from the registry: whoever has a 2027 licence is green straight away; others add it in the next step. T-shirt size from the profile.", "Daten kommen aus dem Register: wer eine Lizenz 2027 hat, ist sofort grün; andere tragen sie im nächsten Schritt ein. T-Shirt-Größe aus dem Profil.", "I dati arrivano dal registro: chi ha la licenza 2027 è subito verde; gli altri la inseriscono al passo successivo. Taglia maglietta dal profilo."]], ["Gumbi za kačenje su zaključani\\. Ako je riba zakačena prije kraja još na štapu, javi sucu \\(dodatno vrijeme\\)\\. Vaganje na rivi od 16:30\\.", ["Strike buttons are locked. If a fish hooked before the end is still on, tell the judge (extra time). Weigh-in on the quay from 16:30.", "Bissknöpfe sind gesperrt. Ist ein vor Ende gehakter Fisch noch dran, Schiedsrichter informieren (Nachspielzeit). Wiegen ab 16:30.", "I pulsanti sono bloccati. Se un pesce allamato prima della fine è ancora in canna, avvisa il giudice (tempo supplementare). Pesatura dalle 16:30."]], ["^(?:NA BRODU|BOATED|AN BORD|A BORDO) · (?:Plavoperajna tuna|Bluefin tuna|Roter Thun|Tonno rosso) · (\\d\\d:\\d\\d) · (zvuk i vibracija|tiho)$", ["BOATED · Bluefin tuna · $1 · @@S$2", "AN BORD · Roter Thun · $1 · @@S$2", "A BORDO · Tonno rosso · $1 · @@S$2"]], ["Poveznica vodi na board turnira — tamo su poredak, svi događaji i sponzori\\. Tko ima aplikaciju, otvara mu se turnir u aplikaciji\\.", ["The link opens the tournament board — standings, all events and sponsors. With the app installed, it opens the tournament in the app.", "Der Link öffnet das Turnier-Board — Rangliste, alle Ereignisse und Sponsoren. Mit installierter App öffnet sich das Turnier in der App.", "Il link apre il tabellone del torneo — classifica, eventi e sponsor. Con l'app installata, si apre il torneo nell'app."]], ["Naručiti možeš bilo kada · rok je 3 sata nakon kraja ribolova \\(danas (\\d\\d:\\d\\d)\\) · poslije roka organizator vidi konačnu listu\\.", ["You can order any time · the deadline is 3 hours after fishing ends (today $1) · after that the organiser sees the final list.", "Bestellen jederzeit möglich · Frist 3 Stunden nach Angelende (heute $1) · danach sieht der Veranstalter die Endliste.", "Puoi ordinare quando vuoi · scadenza 3 ore dopo la fine della pesca (oggi $1) · poi l'organizzatore vede la lista finale."]], ["Rok: sat vremena nakon objave rezultata dana \\(do 17:30\\)\\. Sudac i žiri vide prigovor na jednom mjestu, odluka ostaje zapisana\\.", ["Deadline: one hour after the day's results are published (until 17:30). Judge and jury see the protest in one place; the decision is recorded.", "Frist: eine Stunde nach Veröffentlichung der Tagesergebnisse (bis 17:30). Schiedsrichter und Jury sehen den Protest; die Entscheidung wird gespeichert.", "Termine: un'ora dopo la pubblicazione dei risultati (fino alle 17:30). Giudice e giuria vedono il reclamo; la decisione resta registrata."]], ["Organizator \\((.+)\\) potvrđuje prijavu\\. Obavijest stiže svim članovima posade\\. Natjecateljski broj dobiva se na ždrijebu\\.", ["The organiser ($1) confirms the entry. All crew members get a notification. The competition number is assigned at the draw.", "Der Veranstalter ($1) bestätigt die Anmeldung. Alle Crewmitglieder werden benachrichtigt. Die Startnummer wird ausgelost.", "L'organizzatore ($1) conferma l'iscrizione. Tutti i membri ricevono una notifica. Il numero di gara si assegna al sorteggio."]], ["— prikaz od (\\d\\d:\\d\\d)\\. Kačenja, ulovi, videi i narudžbe šalju se sami čim se veza vrati   /* ---------- backend ---------- */
  function api(put, opt, drugi){
    opt = opt || {};
    var h = Object.assign({ 'Content-Type':'application/json' }, opt.headers || {});
    if (M.access) h.Authorization = 'Bearer ' + M.access;
    return fetch(BACKEND + put, Object.assign({}, opt, { headers:h })).then(function(r){
      if (r.status === 401 && !drugi && M.refresh) return obnovi().then(function(){ return api(put, opt, true); });
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok){
          var ruta = put.split('?')[0].split('/').filter(Boolean).slice(-1)[0] || '';
          var er = new Error((d.error || ('HTTP ' + r.status)) + (r.status >= 500 ? ' · ' + ruta : ''));   // 497: vidi se koja ruta je pukla
          er.status = r.status; er.odServera = true; throw er;
        }
        return d;
      });
    });
  }
  function obnovi(){
    return fetch(BACKEND + '/api/auth/refresh', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ refresh_token:M.refresh }) })
      .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'refresh'); return d; }); })
      .then(function(d){ M.access = d.access_token; M.refresh = d.refresh_token || M.refresh; M.istek = Date.now() + (d.expires_in || 3600) * 1000; spremi(); })
      .catch(function(er){ odjava(true); throw er; });
  }
  setInterval(function(){ if (M.refresh && M.istek && M.istek - Date.now() < 5*60*1000) obnovi().catch(function(){}); }, 60000);

  function otvoriPrijavu(){

  function zatvoriPrijavu(){ ov.style.display = 'none'; }

    g.textContent = '';

      .then(function(d){ M.access = d.access_token; M.refresh = d.refresh_token; M.istek = Date.now() + (d.expires_in || 3600) * 1000; spremi(); return kreni(true); })
      .catch(function(er){ g.textContent = /Invalid login/i.test(er.message) ? t('Kriva e-pošta ili lozinka.') : er.message; })
      .then(function(){ b.disabled = false; });

  function odjava(tiho){
    M.access = null; M.refresh = null; M.istek = 0; M.tid = null;
    M.jaCache = null; M.stCache = null; M.red = []; M.veze = {}; M.uloviId = {}; M.otv = []; M.nedavno = {}; M.poz = []; M.podsj = {}; spremi();   // 498: odjava = čist početak
    P.on = false; document.body.classList.remove('pravo');
    S.prijavljen = false; try{ localStorage.setItem('bgf-prijava', '0'); }catch(e){}
    if (!tiho) tost('Odjavljen si.');

  /* ---------- uloge → moja ekipa ---------- */
  P.ja = null;
  /* BRŽE OTVARANJE (Nikola 13.10.): ako je sve zapamćeno na mobitelu, Na moru
     se crta odmah iz zapamćenog, a server se pita u pozadini i tiho osvježi. */
  function kreni(izPrijave){
    var brzo = !izPrijave && M.jaCache && M.stCache;
    if (brzo) obradiUloge(M.jaCache);
    return api('/api/me/roles').then(function(d){
      M.jaCache = d; spremi();
      if (!P.on) return obradiUloge(d);
      P.ja = d;                                             // već radi iz zapamćenog
      /* ekipa se na serveru promijenila (npr. proba ispočetka) → prebaci se na novu */
      var nova = (d.roles || []).find(function(u){ return u.role === 'team' && u.tournamentId === P.tid; });
      if (!nova || String(nova.teamId) !== String(P.ekipa && P.ekipa.id)){
        P.on = false; M.stCache = null; M.red = []; M.veze = {}; spremi(); obradiUloge(d);
      }
    }, function(er){
      if (!er.odServera && M.jaCache){ P.veza = false; if (!P.on) return obradiUloge(M.jaCache); return; }
      throw er;
    });
  }
  function obradiUloge(d){
    {
      P.ja = d;
      P.ime = d.person ? (d.person.first_name + ' ' + d.person.last_name) : ((d.user && d.user.name) || '');
      var ekipne = (d.roles || []).filter(function(u){ return u.role === 'team' && u.teamId; });
      var naziv = function(id){ var t = (d.tournaments || []).find(function(x){ return x.id === id; }); return t ? t.name : id; };
      if (!ekipne.length){
        zatvoriPrijavu();
        tost('Prijavljen si, ali nisi upisan ni u jednu ekipu. Za suđenje otvori sučev panel.', true);
        return;
      }
      /* Izbor turnira (Nikola 13.10.: „My teams” nije bilo jasno):
         naziv turnira + „Ekipa: …” + datumi; današnji prvi s oznakom DANAS;
         ako je danas točno jedan — otvara se sam. */
      var danas = danasISO();
      var tr = function(id){ return (d.tournaments || []).find(function(x){ return x.id === id; }) || {}; };
      var ekNaziv = function(id){ var e = (d.teams || []).find(function(x){ return String(x.id) === String(id); }); return e ? e.name : ''; };
      var jeDanas = function(id){ var dd = tr(id).day_dates || []; return dd.indexOf(danas) >= 0; };
      var datumi = function(id){ var dd = (tr(id).day_dates || []).slice().sort(); if (!dd.length) return ''; var f = function(x){ var p = x.split('-'); return +p[2] + '. ' + (+p[1]) + '.'; }; return dd.length > 1 ? f(dd[0]) + ' – ' + f(dd[dd.length - 1]) + ' ' + dd[0].slice(0, 4) + '.' : f(dd[0]) + ' ' + dd[0].slice(0, 4) + '.'; };
      var danasnji = ekipne.filter(function(u){ return jeDanas(u.tournamentId); });
      var izbor = ekipne.find(function(u){ return u.tournamentId === M.tid && (jeDanas(u.tournamentId) || !danasnji.length); });
      if (!izbor && danasnji.length === 1) izbor = danasnji[0];
      if (!izbor && ekipne.length === 1) izbor = ekipne[0];
      if (izbor) return otvoriTurnir(izbor.tournamentId, izbor.teamId);
      ekipne.sort(function(a, b){ return (jeDanas(b.tournamentId) ? 1 : 0) - (jeDanas(a.tournamentId) ? 1 : 0); });
      ['ppEmail','ppLoz','ppDa','ppGreska'].forEach(function(id){ document.getElementById(id).style.display = 'none'; });
      ov.querySelector('b').style.display = 'none'; ov.querySelector('.opis').style.display = 'none';
      document.getElementById('ppNe').textContent = t('Odustani');
      ov.style.display = 'flex';
      document.getElementById('ppTurniri').innerHTML = '<div style="margin-top:14px"><b style="font-size:19px">' + t('Odaberi turnir') + '</b><p class="opis" style="margin:2px 0 0">' + t('Na kojem natjecanju ribaš danas?') + '</p></div>'
        + ekipne.map(function(u){
          var dn = jeDanas(u.tournamentId);
          return '<button class="sir" style="margin-top:8px;text-align:left;display:block;width:100%;padding:12px 14px' + (dn ? ';border-color:#0558E8' : '') + '" data-ppt="' + e_(u.tournamentId) + '|' + e_(u.teamId) + '">'
            + '<b style="display:block;font-size:16px">' + e_(naziv(u.tournamentId)) + (dn ? ' <span style="background:#0558E8;color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;vertical-align:2px">' + t('DANAS') + '</span>' : '') + '</b>'
            + '<small style="display:block;font-weight:500;opacity:.75;margin-top:2px">' + t('Ekipa') + ': ' + e_(ekNaziv(u.teamId)) + (datumi(u.tournamentId) ? ' · ' + datumi(u.tournamentId) : '') + '</small></button>'; }).join('');
      document.querySelectorAll('[data-ppt]').forEach(function(x){ x.onclick = function(){ var a = x.dataset.ppt.split('|'); otvoriTurnir(a[0], a[1]); }; });
    }
  }

  function otvoriTurnir(tid, teamId){
    var imaZap = M.stCache && M.stCache.tid === tid;
    if (imaZap && !(P.on && P.tid === tid)) primijeniStanje(M.stCache.st, tid, teamId, true);
    return api('/api/tournaments/' + tid + '/state').then(function(st){
      M.stCache = { tid:tid, st:st }; spremi();
      primijeniStanje(st, tid, teamId, !(P.on && P.tid === tid));
    }, function(er){
      if (!er.odServera && imaZap){ P.veza = false; osvjeziPrikaz(); return; }   // bez signala: radi iz zapamćenog
      if (!P.on) tost(er.message, true);
    });
  }
  function primijeniStanje(st, tid, teamId, prviPut){
    {
      var tr = st.tournament || {};
      var ek = (st.teams || []).find(function(x){ return String(x.id) === String(teamId); }) || { id:teamId, name:'', anglers:[] };
      P.tid = tid; P.ekipa = ek; P.turnir = tr; M.tid = tid; spremi();
      P.rib = {}; P.ribIme = {};
      (ek.anglers || []).forEach(function(a){ P.rib[a.name] = a.id; P.ribIme[a.id] = a.name; });
      P.vrsteId = {}; P.vrste = [];
      (st.ruleSpecies || []).forEach(function(v){ P.vrsteId[v.name] = v.id; if (!/^\s*ostalo\s*$/i.test(v.name || '')) P.vrste.push(v.name); });
      P.imaOstalo = (st.ruleSpecies || []).some(function(v){ return /^\s*ostalo\s*$/i.test(v.name || ''); });
      var dd = tr.day_dates || [], i = dd.indexOf(danasISO());
      P.dan = i >= 0 ? i + 1 : null;
      var fh = (st.fishingHours || []).find(function(x){ return Number(x.day_number) === Number(P.dan); });
      P.sati = fh ? { od:String(fh.start_time || '').slice(0,5), do:String(fh.end_time || '').slice(0,5) } : null;
      /* v69 podaci → pravi */
      TM.naBrodu = (ek.anglers || []).map(function(a){ return a.name; });
      if (!prviPut){ TMS = P.dan ? 'ribolov' : 'gotovo'; osvjeziPrikaz(); return; }   // samo osvježenje: borbe i DANAS ostaju (514: dan/satnica)
      TM.otvorena = (M.otv || []).filter(function(o){ return o.tid === tid; }).map(function(o){
        return Object.assign({}, o, { sek:Math.max(0, Math.round((Date.now() - (o.t0 || Date.now())) / 1000)), javiGrupi:false });
      });
      TM.povijest = []; TM.poruke = []; TM.ovjera = '—';
      P.on = true; document.body.classList.add('pravo');
      S.prijavljen = true; try{ localStorage.setItem('bgf-prijava', '0'); }catch(e){}
      S.v = 'tm'; S.tmtab = 'namoru';
      TMS = P.dan ? 'ribolov' : 'gotovo';
      LIST = null; PONISTI = null;
      zatvoriPrijavu(); window.scrollTo(0, 0);
      crtaj(); osvjezi(); posaljiRed(); brojiVidee().then(function(){ osvjeziPrikaz(); obradiVidee(); });
      setTimeout(zabiljeziPoziciju, 1500); posaljiPozicije();
    }
  }

  /* ---------- zaglavlje (umjesto izmišljenog „Dan 2 / #7 / u zoni”) ---------- */
  P.danTekst = function(){ return P.dan ? ('Dan ' + P.dan) : t('danas se ne lovi'); };   // „Dan N” prevodi v69 (cijeli natpis)
  P.ekipaTekst = function(){ return e_((P.ekipa && P.ekipa.name) || ''); };
  P.doKraja = function(){
    if (!P.sati || !P.sati.do) return '';
    var d = P.sati.do.split(':'), kraj = new Date(); kraj.setHours(+d[0], +d[1], 0, 0);
    var min = Math.round((kraj - Date.now()) / 60000);
    if (min <= 0) return t('ribolov završen');
    return (min >= 60 ? Math.floor(min/60) + ' h ' : '') + (min % 60) + ' min ' + t('do kraja');
  };
  /* 3 koraka na okviru kačenja (Nikola 13.10.): poslano sucu → sudac potvrdio → video 1 */
  P.koraciKac = function(o){

      if (P.sati && D.statDan === 'danas'){ od = Math.min(od, parseInt(P.sati.od, 10) || od); doo = Math.max(doo, (parseInt(P.sati.do, 10) || doo)); }
      var n = Math.min(14, doo - od + 1), st = []; for (var i = 0; i < n; i++) st.push(sati.filter(function(x){ return x === od + i; }).length);
      var mx = Math.max.apply(0, st) || 1, sir = 288 / n;
      h += '<div class="odj">🕐 ' + e_(t('KAČENJA PO SATU')) + '</div><div class="graf"><svg viewBox="0 0 320 110">' + st.map(function(v, i){ var vis = Math.round(v / mx * 76);
        return '<rect x="' + (16 + i * sir).toFixed(1) + '" y="' + (88 - vis) + '" width="' + Math.max(6, sir - 8).toFixed(1) + '" height="' + vis + '" rx="4" fill="#2DD4BF"/>' + (v ? '<text x="' + (16 + i * sir + (sir - 8) / 2).toFixed(1) + '" y="' + (84 - vis) + '" text-anchor="middle" font-size="10" fill="#475569">' + v + '</text>' : '')
          + '<text x="' + (16 + i * sir + (sir - 8) / 2).toFixed(1) + '" y="104" text-anchor="middle" font-size="10" fill="#8a97a8">' + (od + i) + 'h</text>'; }).join('') + '</svg></div>';
    }
    var bo = ul.filter(function(c){ return c.fightMin != null; });
    if (bo.length){
      var dug = bo.slice().sort(function(a, b){ return b.fightMin - a.fightMin; })[0];
      h += '<div class="odj">⏱ ' + e_(t('BORBE')) + '</div><div class="info"><div><b>' + e_(t('Najduža')) + '</b><span data-bezprijevoda>' + dug.fightMin + ' ' + e_(t('min')) + ' · ' + e_(P.vrstaT ? P.vrstaT(dug.species || '') : (dug.species || '')) + '</span></div><div><b>' + e_(t('Prosječna')) + '</b><span>' + Math.round(bo.reduce(function(a, c){ return a + c.fightMin; }, 0) / bo.length) + ' ' + e_(t('min')) + '</span></div></div>';
    }
    return '<main>' + h + '</main>';
  }

  /* ---------------- listovi: Sucu privatno, Nazovi suca, Bodovanje ---------------- */
  function nitHtml(){
    var sve = ((infoOk() && D.info.poruke) || []).slice(-40);
    var cek = M.redPor.filter(function(r){ return r.tid === P.tid; });
    if (!sve.length && !cek.length) return '<p class="opis" style="text-align:center">' + e_(t('Još nema poruka.')) + '</p>';
    return sve.map(function(m){ return '<div class="p5m' + (m.odSuca ? '' : ' ja') + (m.svima ? ' svima' : '') + '" data-bezprijevoda>' + e_(m.tekst) + '<small>' + (m.odSuca ? e_((m.odSuca && (!m.od || m.od === 'Sudac')) ? t('Sudac') : (m.od || t('Sudac'))) + ' · ' : '') + hhmm(m.at) + (m.svima ? ' · ' + e_(t('svim ekipama')) : '') + '</small></div>'; }).join('')
      + cek.map(function(r){ return '<div class="p5m ja" style="opacity:.75" data-bezprijevoda>' + e_(r.tekst) + '<small>⏳ ' + e_(t('čeka signal')) + '</small></div>'; }).join('');
  }
  function osvjeziNit(){ var n = document.getElementById('p5nit'); if (n){ n.innerHTML = nitHtml(); n.scrollTop = n.scrollHeight; } oznake(); }
  function listPoruka(){
    var kraj = P.sati && P.sati.do ? ' ' + P.sati.do : '';
    return '<div class="rucka"></div><b style="font-size:20px">✉ ' + e_(t('Sucu privatno')) + '</b><p class="opis" style="margin:2px 0 0">' + e_(t('Poruku vidi samo sudac.')) + '</p>'
      + '<div class="p5nit" id="p5nit">' + nitHtml() + '</div>'
      + '<div class="cipovi" style="flex-wrap:wrap">' + [t('Vraćamo se u luku'), t('Problem s motorom'), t('Riba još na štapu nakon kraja') + kraj].map(function(x){ return '<button data-p5brzo="' + e_(x) + '">' + e_(x) + '</button>'; }).join('') + '</div>'
      + '<div class="p5unos"><input class="polje" id="p5tekst" maxlength="1000" placeholder="' + e_(t('Napiši poruku…')) + '"><button class="plavi" data-p5posalji>' + e_(t('Pošalji')) + '</button></div>';
  }
  function listSudac(){
    var T = trn(), tel = T.info_judge_phone ? String(T.info_judge_phone).replace(/[^\d+]/g, '') : '';
    return '<div class="rucka"></div><b style="font-size:20px">📞 ' + e_(t('Nazovi suca')) + '</b><div class="info" style="margin-top:10px">'
      + (T.info_judge_name || tel ? '<div><b>' + e_(t('Glavni sudac')) + '</b><span data-bezprijevoda>' + e_(T.info_judge_name || '') + (tel ? ' · <a href="tel:' + e_(tel) + '">' + e_(T.info_judge_phone) + '</a>' : '') + '</span></div>' : '<div><b>' + e_(t('Sudac nije upisan.')) + '</b><span></span></div>')
      + (T.info_vhf ? '<div><b>' + e_(t('VHF kanal')) + '</b><span>' + e_(T.info_vhf) + '</span></div>' : '') + '</div>'
      + (tel ? '<a class="plavi" style="display:block;text-align:center;margin-top:12px;text-decoration:none" href="tel:' + e_(tel) + '">📞 ' + e_(t('nazovi')) + '</a>' : '');
  }
  function listBodovanje(){
    var R = lbOk() ? (D.lb.rules || []) : null;
    if (!R) { ucitajLb(); return '<div class="rucka"></div><b style="font-size:20px">' + e_(t('Pravila bodovanja')) + '</b><p class="opis">' + e_(t('Učitavam…')) + '</p>'; }
    var plas = (D.lb.tournament || {}).rankingMode === 'placement';
    return '<div class="rucka"></div><b style="font-size:20px">' + e_(t('Pravila bodovanja')) + '</b>' + (plas ? '<p class="opis">🏅 ' + e_(t('Plasmansko bodovanje — manje je bolje.')) + '</p>' : '')
      + '<div class="info" style="margin-top:10px">' + R.map(function(r){
        var d = [];
        if (r.minMeasure) d.push(e_(t('najmanje')) + ' ' + e_(r.minMeasure));
        if (r.canRelease) d.push(e_(t('pušteno')) + ' ' + broj(r.releasePts) + ' ' + e_(t('bodova')));
        if (r.canBoat) d.push(e_(t('na brodu')) + ' ' + (r.tiers && r.tiers.length ? r.tiers.map(function(x){ return broj(x.minKg) + '–' + (x.maxKg == null ? '∞' : broj(x.maxKg)) + ' kg: ' + broj(x.ptsPerKg) + '/kg'; }).join(', ') : broj(r.boatPts) + (r.boatMode === 'perkg' ? ' ' + e_(t('po kg')) : '')));
        return '<div><b data-bezprijevoda>' + e_(P.vrstaT ? P.vrstaT(r.name) : r.name) + '</b><span>' + d.join(' · ') + '</span></div>'; }).join('') + '</div>';
  }

  /* ---------------- spoj u v69: ekran tm, listovi, crtaj ---------------- */
  var origTm = EKR.tm;
  EKR.tm = function(){
    var html = origTm.apply(this, arguments);
    if (!P.on) return html;
    var tab = S.tmtab;
    if (tab !== D.zadTab){
      D.zadTab = tab;
      if (tab === 'info'){ setTimeout(function(){ ucitajInfo(); oznaciVidjeno(); }, 0); }
      if ((tab === 'poredak' || tab === 'stat') && Date.now() - D.lbOd > 20000) setTimeout(ucitajLb, 0);
      if (tab === 'zona') setTimeout(gpsUkljuci, 0);
    }
    var nov = tab === 'info' ? ekranInfo() : tab === 'zona' ? ekranZona() : tab === 'poredak' ? ekranPoredak() : tab === 'stat' ? ekranStat() : null;
    if (!nov){
      /* Na moru: stvarno upozorenje zone na vrhu */
      var s = stanjeZone();
      if (s && s.st !== 'u' && P.dan){
        var up = '<div class="upoz zona526" style="background:' + (s.st === 'izvan' ? '#fef2f2;border-color:#fecaca;color:#991b1b' : '#fff7ed;border-color:#fed7aa;color:#9a3412') + '">⚠ <div><b>' + (s.st === 'izvan' ? e_(t('Izvan zone')) + ' · ' + broj(s.nm, 2) + ' NM' : broj(s.nm, 2) + ' NM ' + e_(t('do granice zone'))) + '</b>' + (s.st === 'izvan' ? ' — ' + e_(t('Kačenje izvan zone ide sucu s upozorenjem.')) : '') + '</div></div>';
        html = html.replace('<main>', '<main>' + up);
      }
      return html;
    }
    var i = html.indexOf('<main>'), j = html.lastIndexOf('</main>');
    if (i < 0 || j < 0) return html;
    return html.slice(0, i) + nov + html.slice(j + 7);
  };
  var origList = window.listHtml;
  window.listHtml = function(){
    if (P.on && LIST){
      if (LIST.k === 'tm-poruka') return listPoruka();
      if (LIST.k === 'tm-sudac') return listSudac();
      if (LIST.k === 'tm-bodovanje') return listBodovanje();
    }
    return origList.apply(this, arguments);
  };
  var origStatus = P.statusTekst;
  P.statusTekst = function(){
    var s = P.dan ? stanjeZone() : null;
    if (s && s.st === 'izvan') return '⚠ ' + t('IZVAN ZONE');
    if (s && s.st === 'blizu') return '⚠ ' + broj(s.nm, 1) + ' NM';
    return origStatus.apply(this, arguments);
  };
  function oznake(){
    if (!naTm()) return;
    var n = neprocitano(), b = document.querySelector('[data-tmtab="info"]');
    if (b){ var x = b.querySelector('.p5bad'); if (n && S.tmtab !== 'info'){ if (!x){ x = document.createElement('i'); x.className = 'p5bad'; b.appendChild(x); } x.textContent = n; } else if (x) x.remove(); }
    var st = document.querySelector('.tmstatus'), s = P.dan ? stanjeZone() : null;
    if (st){ st.classList.toggle('p5izvan', !!(s && s.st === 'izvan')); st.classList.toggle('p5blizu', !!(s && s.st === 'blizu')); }
  }
  var origCrtaj = window.crtaj;
  window.crtaj = function(){
    var r = origCrtaj.apply(this, arguments);
    try{
      oznake();
      if (P.on && LIST && LIST.k === 'tm-poruka'){
        oznaciProcitano();
        var n = document.getElementById('p5nit'); if (n) n.scrollTop = n.scrollHeight;
        var u = document.getElementById('p5tekst'); if (u && !u.dataset.p5){ u.dataset.p5 = '1'; u.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); novaPoruka(u.value); u.value = ''; } }); }
      }
    }catch(e){}
    return r;
  };

  /* ---------------- klikovi ---------------- */
  document.addEventListener('click', function(ev){
    if (!P.on) return;
    var b = ev.target.closest('[data-p5srd],[data-p5srdposalji],[data-p5srdjucer],[data-p5srdpromijeni],[data-p5posalji],[data-p5brzo],[data-p5por],[data-p5stat]');
    if (!b) return;
    ev.stopPropagation(); ev.preventDefault();
    var d = b.dataset;
    if (d.p5srd){ D.srdN = Math.max(0, Math.min(50, (D.srdN || 0) + Number(d.p5srd))); crtaj(); return; }
    if (b.hasAttribute('data-p5srdjucer')){ var sj = D.info && D.info.srdele; if (sj) naruci(sj.jucer); return; }
    if (b.hasAttribute('data-p5srdposalji')){ naruci(D.srdN || 0); return; }
    if (b.hasAttribute('data-p5srdpromijeni')){ D.srdMijenja = true; D.srdN = (D.info && D.info.srdele && D.info.srdele.paketa) || 0; crtaj(); return; }
    if (b.hasAttribute('data-p5posalji')){ var u = document.getElementById('p5tekst'); if (u){ novaPoruka(u.value); u.value = ''; u.focus(); } return; }
    if (d.p5brzo){ novaPoruka(d.p5brzo); return; }
    if (d.p5por){ D.porDan = d.p5por; crtaj(); return; }
    if (d.p5stat){ D.statDan = d.p5stat; crtaj(); return; }
  }, true);

  /* ---------------- vrijeme ---------------- */
  setInterval(function(){ if (P.on && !document.hidden) ucitajInfo(); }, 30000);
  setInterval(function(){ if (P.on && !document.hidden && (S.tmtab === 'poredak' || S.tmtab === 'stat')) ucitajLb(); }, 60000);
  setInterval(function(){ if (P.on && !document.hidden){ posaljiPoruke(); posaljiSrdele(false); if (P.dan) gpsUkljuci(); } }, 15000);
  window.addEventListener('online', function(){ setTimeout(function(){ posaljiPoruke(); posaljiSrdele(false); ucitajInfo(); }, 1500); });
  document.addEventListener('visibilitychange', function(){ if (document.hidden) gpsIskljuci(); else if (P.on){ ucitajInfo(); if (P.dan || S.tmtab === 'zona') gpsUkljuci(); } });
  /* prvi put nakon otvaranja turnira */
  var cekajOn = setInterval(function(){
    if (!P.on || !P.tid) return;
    clearInterval(cekajOn);
    ucitajInfo(); ucitajLb(); posaljiPoruke(); posaljiSrdele(false); if (P.dan) gpsUkljuci();
  }, 700);
  P.p526 = { D:D, ucitajInfo:ucitajInfo, ucitajLb:ucitajLb, stanjeZone:stanjeZone };
})(typeof P !== 'undefined' ? P : null);
