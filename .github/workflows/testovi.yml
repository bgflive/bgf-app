# 568 · O2 — Playwright testovi aplikacije pri svakom dizanju (GitHub Pages i dalje objavljuje kao dosad)
name: Testovi aplikacije
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: test
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: npm test
        working-directory: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slike-ekrana
          path: test/slike
          if-no-files-found: ignore
